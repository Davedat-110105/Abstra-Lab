<div class="dashboard-panel">
  <div class="dashboard-panel__header">
    <div>
      <p class="section-eyebrow">{{ event.date_label }}{% if event.location %} · {{ event.location }}{% endif %}</p>
      <h2>{{ event.title }}</h2>
      {% if event.summary %}
      <p class="sx-page-hero__lede" style="margin-top:12px">{{ event.summary }}</p>
      {% endif %}
    </div>
    <a class="sx-btn sx-btn--compact" href="{% url 'core:dashboard' %}?section=events">All events</a>
  </div>
  {% if event.has_media %}
  <figure class="blog-featured">
    {% include "core/includes/event_media.html" with event=event media_class="" %}
  </figure>
  {% endif %}
  <article class="blog-content">
    {{ event.description|linebreaks }}
  </article>
</div>
