<div class="dashboard-panel">
  <div class="dashboard-panel__header">
    <div>
      <p class="section-eyebrow">{{ post.created_at|date:"M j, Y" }} · {{ post.author.get_full_name|default:post.author.username }}</p>
      <h2>{{ post.title }}</h2>
      {% if post.excerpt %}
      <p class="sx-page-hero__lede" style="margin-top:12px">{{ post.excerpt }}</p>
      {% endif %}
    </div>
    <a class="sx-btn sx-btn--compact" href="{% url 'core:dashboard' %}?section=posts">All posts</a>
  </div>
  {% if post.featured_image %}
  <figure class="blog-featured">
    <img src="{{ post.featured_image.url }}" alt="{{ post.title }}">
  </figure>
  {% endif %}
  <article class="blog-content">
    {{ post.content|linebreaks }}
  </article>
</div>
