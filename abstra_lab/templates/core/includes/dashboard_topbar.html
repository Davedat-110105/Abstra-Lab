<section class="dashboard-topbar">
  <div class="wrap dashboard-topbar__inner">
    <div class="dashboard-topbar__title-block">
      <p class="dashboard-topbar__eyebrow">{{ topbar_eyebrow }}</p>
      <h1 class="dashboard-topbar__title">{{ topbar_title }}</h1>
    </div>
    {% if topbar_meta %}
    <ul class="dashboard-topbar__meta">
      {% for item in topbar_meta %}
      <li>{{ item }}</li>
      {% endfor %}
    </ul>
    {% endif %}
  </div>
</section>
