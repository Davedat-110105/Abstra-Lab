services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-astra}
      POSTGRES_USER: ${POSTGRES_USER:-astra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISH_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-astra} -d ${POSTGRES_DB:-astra}"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: ${ASTRA_FRONTEND_IMAGE:-astra-lab-frontend:latest}
    restart: unless-stopped
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-local-next-session-secret}
      DATABASE_URL: postgresql://${POSTGRES_USER:-astra}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-astra}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${FRONTEND_PUBLISH_PORT:-3001}:3000"

volumes:
  postgres_data:
