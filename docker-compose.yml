services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-astra}
      POSTGRES_USER: ${POSTGRES_USER:-astra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISH_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-astra} -d ${POSTGRES_DB:-astra}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for local dev (SeaweedFS — MinIO's OSS edition
  # was archived Apr 2026). Point the app at this via S3_ENDPOINT=http://localhost:8333
  # (host `next dev`). On Vercel S3_ENDPOINT is left unset, so the same code talks
  # to real AWS S3 instead. The public/private split is enforced by seaweedfs-s3.json:
  # the anonymous identity may read only the public/ prefix. Filer UI: :8888.
  seaweedfs:
    image: chrislusf/seaweedfs
    restart: unless-stopped
    # -volume.max=100: SeaweedFS makes a storage collection per S3 bucket; the
    # single-node dev server needs spare volume slots or bucket writes fail with
    # "no writable volumes". 100 is ample headroom for local dev.
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -volume.max=100
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:8888:8888"
    volumes:
      - seaweedfs_data:/data
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  # One-shot: create the bucket once the S3 gateway is up, then exit. Anonymous
  # public-read on public/ is granted by the identity config, not a bucket policy.
  s3init:
    image: amazon/aws-cli
    depends_on:
      - seaweedfs
    # Must match the admin identity in docker/seaweedfs-s3.json.
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: ${AWS_REGION:-ca-central-1}
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://seaweedfs:8333 s3 ls; do echo 'waiting for seaweedfs...'; sleep 2; done;
      aws --endpoint-url http://seaweedfs:8333 s3 mb s3://${S3_BUCKET:-astra-labs-uploads} || true;
      "

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${ASTRA_FRONTEND_IMAGE:-astra-lab-frontend:latest}
    restart: unless-stopped
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?Set a long random AUTH_SECRET in .env}
      # Set to 1 when serving over HTTPS; kept 0 here for plain-HTTP localhost.
      AUTH_SECURE_COOKIE: ${AUTH_SECURE_COOKIE:-0}
      # Required for the telemetry ingest endpoint to accept writes (fails closed if unset).
      TELEMETRY_INGEST_TOKEN: ${TELEMETRY_INGEST_TOKEN:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-astra}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-astra}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${FRONTEND_PUBLISH_PORT:-3001}:3000"

volumes:
  postgres_data:
  seaweedfs_data:
